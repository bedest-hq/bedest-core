name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Reused by the release workflow so nothing is published unverified.
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name when reused, so a release run
  # never cancels (or is cancelled by) the push-triggered CI run.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build, pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Package contents
        run: npm pack --dry-run
